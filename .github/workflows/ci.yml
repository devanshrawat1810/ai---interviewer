name: CI Quality & Testing Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Architectural Layer Verification
  # ============================================================================
  architecture-check:
    name: Architecture Layer Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Documentation checked: https://github.com/actions/checkout (v4.2.2 pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        # Documentation checked: https://github.com/actions/setup-python (v5.3.0 pinned)
        uses: actions/setup-python@0a5c61591373683505ea898e09a6ea86e8b16631 # v5.3.0
        with:
          python-version: '3.11'

      - name: Verify Architectural Layer Boundaries
        run: |
          python3 scripts/check_layers.py

      - name: Run Layer Checker Unit Test
        run: |
          python3 -m unittest tests/test_check_layers.py

  # ============================================================================
  # 2. Core Build & Tests (Linux & Windows Matrix)
  # ============================================================================
  core:
    name: Core Build & Tests (${{ matrix.os }})
    needs: architecture-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake (BUILD_GUI=OFF)
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=OFF

      - name: Build Core, Console App, and Test Suite
        run: cmake --build build --config Release

      - name: Run Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

  # ============================================================================
  # 3. MongoDB Integration Tests (with Service Container)
  # ============================================================================
  mongo:
    name: MongoDB Integration Test Suite
    needs: architecture-check
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake with Mongo Integration
        env:
          STORAGE_BACKEND: mongo
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: ai_interviewer_test
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=OFF

      - name: Build Targets
        run: cmake --build build --config Release

      - name: Run Integration Tests Against Live Mongo Container
        env:
          STORAGE_BACKEND: mongo
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: ai_interviewer_test
        run: ctest --test-dir build -C Release --output-on-failure

  # ============================================================================
  # 4. Sanitizer Build (ASan / UBSan)
  # ============================================================================
  sanitizers:
    name: Memory & Undefined Behavior Sanitizers
    needs: architecture-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure with ASan and UBSan
        run: >
          cmake -B build_san -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DBUILD_GUI=OFF

      - name: Build Sanitized Targets
        run: cmake --build build_san

      - name: Run Tests with Sanitizers Active
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:abort_on_error=1"
        run: ctest --test-dir build_san --output-on-failure

  # ============================================================================
  # 5. Linting & Formatting Check
  # ============================================================================
  lint:
    name: Code Formatting & Clang Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Clang Format
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find include src tests -name '*.h' -o -name '*.cpp' | xargs clang-format --dry-run -Werror || {
            echo "Formatting check completed (informational). Run clang-format -i to reformat."
          }
