name: Deploy Web Client to GitHub Pages

on:
  push:
    branches: [ master, main ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Documentation checked: https://github.com/actions/checkout (v4.2.2 pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
        # Documentation checked: https://github.com/actions/configure-pages (v5 pinned)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages Artifact
        # Documentation checked: https://github.com/actions/upload-pages-artifact (v3 pinned)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        # Documentation checked: https://github.com/actions/deploy-pages (v4 pinned)
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
