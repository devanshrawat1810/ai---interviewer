name: Automated Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: ai-interviewer-linux-x64.tar.gz
          - os: windows-latest
            artifact_name: ai-interviewer-windows-x64.zip

    steps:
      - name: Checkout repository
        # Documentation checked: https://github.com/actions/checkout (v4.2.2 pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=OFF

      - name: Build Application & Tools
        run: cmake --build build --config Release

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/bin package/data package/scripts
          cp build/ai_interviewer package/bin/
          cp build/seed_db package/bin/
          cp -r data/* package/data/
          cp -r scripts/* package/scripts/
          cp README.md LICENSE package/
          tar -czvf ${{ matrix.artifact_name }} -C package .

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/bin, package/data, package/scripts | Out-Null
          Copy-Item build/Release/ai_interviewer.exe package/bin/
          Copy-Item build/Release/seed_db.exe package/bin/
          Copy-Item -Recurse data/* package/data/
          Copy-Item -Recurse scripts/* package/scripts/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Release Artifact
        # Documentation checked: https://github.com/actions/upload-artifact (v4.4.3 pinned)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Artifacts
        # Documentation checked: https://github.com/actions/download-artifact (v4.1.8 pinned)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8

      - name: Create Release
        # Documentation checked: https://github.com/softprops/action-gh-release (v2.0.8 pinned)
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            */*.tar.gz
            */*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
